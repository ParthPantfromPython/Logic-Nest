<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Logic Nest — Edit Project</title><link rel="icon" href="Gemini_Generated_Image_f72yx0f72yx0f72y.ico"><style>:root{--bg:#050912;--panel:#0c1422;--text:#f5f8ff;--muted:#8fa2ba;--line:#ffffff14;--a:#70f4d0;--b:#8aa0ff;--danger:#ff718f}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 7% 0,#70f4d01c,transparent 30%),radial-gradient(circle at 95% 10%,#8aa0ff18,transparent 28%),var(--bg)}button,input,textarea,select{font:inherit}.wrap{width:min(1000px,92%);margin:auto;padding:24px 0 55px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}.brand img{width:42px;height:42px;border-radius:12px}.brand small{display:block;color:var(--a);font:900 8px ui-monospace;letter-spacing:.15em}.sp{flex:1}.btn{border:1px solid var(--line);background:#ffffff07;color:var(--text);padding:10px 13px;border-radius:10px;font-weight:900;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#061017}.danger{border:0;background:var(--danger);color:#18050a}.panel{border:1px solid var(--line);background:#0c1422e8;backdrop-filter:blur(18px);border-radius:22px;padding:22px;box-shadow:0 30px 100px #0008}.ey{color:var(--a);font:900 9px ui-monospace;letter-spacing:.18em}.hero h1{font-size:clamp(38px,6vw,64px);line-height:.9;letter-spacing:-.06em;margin:10px 0}.muted{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:10px;font-weight:900;margin:0 0 6px}.field{width:100%;border:1px solid #294057;background:#07101c;color:var(--text);padding:11px;border-radius:10px;outline:none}.field:focus{border-color:#70f4d055}.checks{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.checks label{margin:0;color:var(--text);display:flex;gap:7px;align-items:center}.checks input{width:auto}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}.status{margin-top:12px;padding:11px;border-radius:10px;font-size:11px;background:#081723;color:#baf6e7}.error{color:#ffb0b0;background:#32131b}.preview{display:flex;gap:14px;align-items:center;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#ffffff04}.preview img{width:72px;height:72px;border-radius:14px;object-fit:cover}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{flex-wrap:wrap}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="admin.html"><img src="Gemini_Generated_Image_f72yx0f72yx0f72y.png"><span><b>Logic Nest</b><small>PROJECT EDITOR</small></span></a><div class="sp"></div><a class="btn" href="manage-projects.html">← Manage</a><button class="btn" id="logout">Sign out</button></header><section class="panel"><div class="ey">DATABASE PROJECT // EDIT MODE</div><h1>Edit this project.</h1><p class="muted">This editor changes a published Supabase project record. External projects still open in their real Lovable, GitHub, or Replit environment from the manager.</p><form id="form" class="grid"><div><label>Project title</label><input class="field" id="title" required></div><div><label>Icon / emoji</label><input class="field" id="icon" maxlength="8"></div><div class="full"><label>Description</label><textarea class="field" id="description" rows="4"></textarea></div><div class="full"><label>Tags (comma separated)</label><input class="field" id="tags" placeholder="Web, AI, Python"></div><div><label>Live demo URL</label><input class="field" id="demo" type="url"></div><div><label>Source / repository URL</label><input class="field" id="source" type="url"></div><div class="full checks"><label><input id="published" type="checkbox"> Published</label><label><input id="featured" type="checkbox"> Featured</label></div><div class="full preview" id="preview"><img id="previewImg" alt="Project image"><div><b id="previewTitle">Loading…</b><div class="muted" id="previewMeta">Reading project record…</div></div></div><div class="full actions"><button class="btn danger" type="button" id="delete">Delete Project</button><button class="btn primary" type="submit">Save Changes →</button></div><div class="full status hidden" id="status"></div></form></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const cfg=LOGIC_NEST_SUPABASE;const sb=supabase.createClient(cfg.url,cfg.publishableKey);const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');function msg(t,err=false){$('status').textContent=t;$('status').className='status '+(err?'error':'');}async function auth(){const {data:{user}}=await sb.auth.getUser();if(!user||user.email.toLowerCase()!==cfg.adminEmail.toLowerCase()){location.href='admin.html';throw 0}}async function load(){await auth();if(!id){msg('No project id was supplied.',true);return}const {data,error}=await sb.from('projects').select('*').eq('id',id).single();if(error){msg(error.message,true);return} $('title').value=data.title||'';$('icon').value=data.icon||'LN';$('description').value=data.description||'';$('tags').value=(data.tags||[]).join(', ');$('demo').value=data.demo_url||'';$('source').value=data.source_url||'';$('published').checked=!!data.published;$('featured').checked=!!data.featured;$('previewTitle').textContent=data.title||'Project';$('previewMeta').textContent=data.published?'Published project':'Draft project';$('previewImg').src=data.image_url||'Gemini_Generated_Image_f72yx0f72yx0f72y.png';$('form').dataset.loaded='1'}$('form').onsubmit=async e=>{e.preventDefault();if(!$('form').dataset.loaded)return;msg('Saving…');const payload={title:$('title').value.trim(),icon:$('icon').value.trim()||'LN',description:$('description').value.trim(),tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),demo_url:$('demo').value.trim(),source_url:$('source').value.trim(),published:$('published').checked,featured:$('featured').checked};const {error}=await sb.from('projects').update(payload).eq('id',id);if(error){msg(error.message,true);return}msg('Saved. Returning to project manager…');setTimeout(()=>location.href='manage-projects.html',500)};$('delete').onclick=async()=>{if(!confirm('Delete this Supabase project record? This cannot be undone.'))return;const {error}=await sb.from('projects').delete().eq('id',id);if(error){msg(error.message,true);return}location.href='manage-projects.html'};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin.html'};load()})();</script></body></html>
