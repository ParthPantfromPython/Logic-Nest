<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logic Nest Admin</title><style>body{margin:0;background:#050b14;color:#eef6ff;font-family:system-ui}.box{max-width:720px;margin:8vh auto;padding:28px;background:#0d1a2b;border:1px solid #203248;border-radius:20px}input,textarea{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:12px;border-radius:10px;border:1px solid #2a4058;background:#07111f;color:#fff}button{padding:11px 15px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#69e7c9}.row{border:1px solid #203248;padding:15px;border-radius:12px;margin:10px 0}.danger{background:#ff6b6b}.muted{color:#9db0c7}.hidden{display:none}.note{padding:12px;background:#091827;border-radius:10px;color:#9db0c7;font-size:13px}</style></head><body><div class="box"><h1>Logic Nest Admin</h1><div id="login"><p class="muted">Private project manager</p><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Unlock Admin</button><p id="err"></p></div><div id="panel" class="hidden"><div class="note">Static GitHub Pages cannot securely write to your GitHub repository. This panel can prepare/export project data; true private publishing needs authenticated backend access.</div><h2>Add Project</h2><input id="title" placeholder="Project title"><textarea id="desc" placeholder="Description"></textarea><input id="tags" placeholder="Tags, comma separated"><input id="image" placeholder="Image filename or URL"><input id="demo" placeholder="Live demo URL"><input id="source" placeholder="GitHub/source URL"><button class="primary" onclick="add()">Add Project</button><h2>Projects</h2><div id="list"></div><button onclick="download()">Export projects.js</button> <button onclick="logout()">Lock</button></div></div><script>const KEY='lnUnlocked',DATA='lnAdminProjects';function login(){if(pw.value==='CHANGE-ME'){localStorage.setItem(KEY,'1');show()}else err.textContent='Incorrect password.'}function show(){loginBox.classList.add('hidden');panel.classList.remove('hidden');render()}function logout(){localStorage.removeItem(KEY);location.reload()}function get(){return JSON.parse(localStorage.getItem(DATA)||'[]')}function add(){let p={title:title.value.trim(),description:desc.value.trim(),tags:tags.value.split(',').map(x=>x.trim()).filter(Boolean),icon:'LN',image:image.value.trim(),demo:demo.value.trim(),source:source.value.trim()};if(!p.title)return;let a=get();a.push(p);localStorage.setItem(DATA,JSON.stringify(a));render()}function remove(i){let a=get();a.splice(i,1);localStorage.setItem(DATA,JSON.stringify(a));render()}function render(){list.innerHTML=get().map((p,i)=>'<div class="row"><b>'+p.title+'</b><div class="muted">'+p.tags.join(' • ')+'</div><button class="danger" onclick="remove('+i+')">Delete</button></div>').join('')||'<p class="muted">No projects yet.</p>'}function download(){let s='window.logicNestProjects = '+JSON.stringify(get(),null,2)+';';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/javascript'}));a.download='projects.js';a.click()}const loginBox=document.getElementById('login'),panel=document.getElementById('panel'),list=document.getElementById('list'),pw=document.getElementById('pw'),err=document.getElementById('err');if(localStorage.getItem(KEY))show();</script></body></html>
