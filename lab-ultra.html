$("newFile").onclick=addFile;$("refresh").onclick=()=>{renderTree();renderTabs();toast("Explorer refreshed")};$("run").onclick=()=>ext(state.active)==="py"?runPython():web();$("build").onclick=()=>ext(state.active)==="py"?runPython():web();$("save").onclick=save;$("format").onclick=format;$("open").onclick=openPreview;$("reload").onclick=web;$("clear").onclick=()=>$("terminal").textContent="logic-nest $ terminal cleared";$("command").onclick=showPalette;document.querySelectorAll(".menu").forEach(x=>x.onclick=showPalette);document.querySelectorAll(".bt").forEach(x=>x.onclick=()=>panel(x.dataset.p));$("paletteInput").oninput=()=>{cmdIndex=0;renderCommands()};$("paletteInput").onkeydown=e=>{let a=[...$("cmds").children];if(e.key==="ArrowDown"){e.preventDefault();cmdIndex=Math.min(a.length-1,cmdIndex+1);renderCommands()}if(e.key==="ArrowUp"){e.preventDefault();cmdIndex=Math.max(0,cmdIndex-1);renderCommands()}if(e.key==="Enter"&&a[cmdIndex])a[cmdIndex].click();if(e.key==="Escape")hidePalette()};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==="p"){e.preventDefault();showPalette()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="n"){e.preventDefault();addFile()}if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();ext(state.active)==="py"?runPython():web()}if(e.key==="F6"){e.preventDefault();runPython()}if(e.key==="Escape")hidePalette()});
function startFallback(){
 if(fallbackMode)return;
 fallbackMode=true;
 const host=$("monaco"),ta=$("fallbackEditor");
 host.style.display="none";ta.style.display="block";
 editor={
  _model:null,
  setModel(m){this._model=m;ta.value=m.getValue()},
  getValue(){return ta.value},
  focus(){ta.focus()},
  getAction(){return{run:()=>{}}},
  onDidChangeModelContent(fn){ta.addEventListener("input",fn)},
  onDidChangeCursorPosition(fn){ta.addEventListener("keyup",()=>{let before=ta.value.slice(0,ta.selectionStart),lines=before.split("\n");fn({position:{lineNumber:lines.length,column:lines.at(-1).length+1}})})}
 };
 ta.addEventListener("input",()=>{let m=fallbackModels[state.active];if(m)m.setValue(ta.value)});
 load();Object.keys(state.files).forEach(makeModel);renderTree();renderTabs();openFile(state.active);showPackages();initPython();
 editor.onDidChangeModelContent(()=>{state.dirty=true;setStatus("Modified")});
 editor.onDidChangeCursorPosition(e=>$("cursor").textContent="Ln "+e.position.lineNumber+", Col "+e.position.column);
 $("loading").classList.add("hide");setStatus("Fallback editor ready");toast("Editor loaded in compatibility mode")
}
function setup(){
 let finished=false;
 const fallbackTimer=setTimeout(()=>{if(!finished)startFallback()},7000);
 if(typeof window.require!=="function"){clearTimeout(fallbackTimer);startFallback();return}
 window.require.config({paths:{vs:"https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"}});
 window.require(["vs/editor/editor.main"],()=>{
  if(finished)return;finished=true;clearTimeout(fallbackTimer);
  try{
   monaco.editor.defineTheme("logic-nest",{base:"vs-dark",inherit:true,rules:[],colors:{"editor.background":"#0f1115","editorGutter.background":"#0f1115","editorLineNumber.foreground":"#4f5662","editorCursor.foreground":"#70f4d0","editor.selectionBackground":"#264f78"}});
   editor=monaco.editor.create($("monaco"),{theme:"logic-nest",fontFamily:"Cascadia Code,Consolas,monospace",fontSize:13,lineHeight:21,minimap:{enabled:true},tabSize:2,insertSpaces:true,automaticLayout:true,scrollBeyondLastLine:false,bracketPairColorization:{enabled:true},guides:{bracketPairs:true},autoClosingBrackets:"always",autoClosingQuotes:"always",autoIndent:"full",formatOnPaste:true,formatOnType:true,quickSuggestions:true});
   monaco.languages.registerCompletionItemProvider("python",{provideCompletionItems:()=>({suggestions:["print","len","range","enumerate","numpy","pandas","matplotlib","scipy","sympy","sklearn","networkx","requests","import","from","def","class","for","while","if","elif","else","try","except","with","async","await"].map(x=>({label:x,kind:monaco.languages.CompletionItemKind.Text,insertText:x}))})});
   load();Object.keys(state.files).forEach(makeModel);renderTree();renderTabs();openFile(state.active);showPackages();initPython();
   editor.onDidChangeModelContent(()=>{state.dirty=true;setStatus("Modified")});
   editor.onDidChangeCursorPosition(e=>$("cursor").textContent="Ln "+e.position.lineNumber+", Col "+e.position.column);
   $("loading").classList.add("hide");setStatus("Editor ready")
  }catch(err){console.error(err);finished=false;startFallback()}
 },err=>{if(!finished){finished=true;clearTimeout(fallbackTimer);startFallback()}});
}</script></body></html>
